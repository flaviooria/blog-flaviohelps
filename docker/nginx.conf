# nginx para el blog estático. Va detrás de Traefik, que pone el TLS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Detrás del proxy: redirecciones relativas (/blog -> /blog/) sin el
    # host ni el puerto interno (8080) del contenedor.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/xml application/rss+xml image/svg+xml text/plain;

    # Healthcheck del contenedor
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets de Astro con hash en el nombre: inmutables
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Índice de búsqueda: cambia en cada build
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location = /rss.xml {
        default_type application/rss+xml;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    # Páginas: siempre se revalidan (cambian en cada despliegue)
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ $uri.html =404;
    }
}
