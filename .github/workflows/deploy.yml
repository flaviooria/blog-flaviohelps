name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

# No cancelar un despliegue a medias: podría dejar el VPS en un estado raro
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest = lo que despliega el VPS; sha-<commit> = ancla para rollback
          tags: |
            ghcr.io/flaviooria/blog-flaviohelps:latest
            ghcr.io/flaviooria/blog-flaviohelps:sha-${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            docker compose -f compose.prod.yml --env-file .env.prod pull
            docker compose -f compose.prod.yml --env-file .env.prod up -d
